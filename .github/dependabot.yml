version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - no-deploy
  # The Firestore rules emulator suite. Its lockfile is generated with the Node
  # version that CI pins (22), so let Dependabot update it in place.
  - package-ecosystem: npm
    directory: "/rules_tests"
    schedule:
      interval: weekly
    labels:
      - no-deploy
  # Keep the commit-SHA pins current; it rewrites the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - no-deploy

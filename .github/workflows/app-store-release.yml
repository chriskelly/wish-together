name: App Store Release

# Tag `v1.2.0` (or run manually with a version) -> upload and submit for review.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version to release (e.g. 1.2.0 — no leading v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: app-store-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & submit to App Store
    runs-on: macos-26
    env:
      CI: true
      FLUTTER_VERSION: "3.47.7"
      APP_IDENTIFIER: gift.wishtogether
      DEVELOPMENT_TEAM: CD8XP2U645
      # Fallback only — App Store Connect build numbers are monotonic per app.
      BUILD_NUMBER: ${{ github.run_number }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
    steps:
      - name: Resolve release version
        env:
          # Passed via env, never interpolated into the shell script.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "Release version is required (tag v1.2.3 or workflow_dispatch version input)." >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 1.2.0 (got: $VERSION)" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION (event: ${{ github.event_name }})"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure SSH for match
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Add GitHub to known hosts
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Build and submit to the App Store
        run: bundle exec fastlane app_store_release

name: iOS CI

# PR / push to master -> iOS compile gate + unit tests on a macOS runner.
# This is the only PR-triggered iOS check; signing and uploads live in
# testflight-release.yml (chained after this via workflow_run) and
# app-store-release.yml, so no permanently-Skipped check shows on PRs.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned to the toolchain this repo targets (see AGENTS.md / pubspec.yaml).
  FLUTTER_VERSION: "3.47.7"

jobs:
  ios:
    name: Test & build (iOS)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build for the iOS simulator
        # Compile gate only; no signing. Real device builds run in TestFlight.
        run: flutter build ios --simulator

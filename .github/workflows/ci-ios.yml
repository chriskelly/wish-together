name: iOS CI

# PR / push to master -> iOS compile gate + unit tests on a macOS runner.
# This is the only PR-triggered iOS check; signing and uploads live in
# testflight-release.yml (chained after this via workflow_run) and
# app-store-release.yml, so no permanently-Skipped check shows on PRs.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned to the toolchain this repo targets (see AGENTS.md / pubspec.yaml).
  FLUTTER_VERSION: "3.47.7"

jobs:
  ios:
    name: Test & build (iOS)
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify the iOS SDK
        # xcode-27 must provide the iOS 27 SDK App Store Connect requires for
        # uploads from April 2027; fail before the build if the image regresses.
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $sdk_version"
          sdk_major="${sdk_version%%.*}"
          case "$sdk_major" in
            ''|*[!0-9]*)
              echo "::error::Could not parse the iPhoneOS SDK version (${sdk_version}); refusing to continue."
              exit 1
              ;;
          esac
          if [ "$sdk_major" -lt 27 ]; then
            echo "::error::Expected the iOS 27 SDK or newer, got ${sdk_version}."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build for the iOS simulator
        # Compile gate only; no signing. Real device builds run in TestFlight.
        run: flutter build ios --simulator

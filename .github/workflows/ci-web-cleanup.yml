name: Web CI cleanup

# Deletes the PR's Firebase Hosting preview channel once the PR closes.
# This is a separate workflow so normal PR runs do not show a permanently
# skipped cleanup job in the checks list.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: web-ci-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  # Match `rules_tests/package.json`; bump both together.
  FIREBASE_TOOLS_VERSION: "15.34.2"
  CHANNEL_ID: pr-${{ github.event.pull_request.number }}

jobs:
  cleanup-preview:
    name: Delete preview channel
    # Fork and Dependabot PRs never created a channel and receive no secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        # Firebase resolves the project from .firebaserc, keeping one source of truth.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Delete the preview channel
        run: |
          # Best-effort: the channel may never have been created, or already expired.
          if ! npx --yes firebase-tools@"$FIREBASE_TOOLS_VERSION" \
              hosting:channel:delete "$CHANNEL_ID" --force; then
            echo "::warning::No preview channel $CHANNEL_ID to delete."
          fi

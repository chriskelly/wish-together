name: Web CI

# PR  -> analyze, test, build, deploy a Firebase Hosting preview channel and comment it on the PR.
# push to master -> the same checks, then deploy live to https://wishtogether.gift.
# Preview-channel cleanup lives in .github/workflows/ci-web-cleanup.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

# Collapse superseded PR runs; never cancel a live deploy on master.
concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned to the toolchain this repo targets (see AGENTS.md / pubspec.yaml).
  FLUTTER_VERSION: "3.47.7"
  FIREBASE_TOOLS_VERSION: "15.34.0"
  # Preview channels expire after this long; the PR comment quotes the same value.
  PREVIEW_EXPIRES: "7d"
  # Evaluates to `pr-<number>` on pull requests; unused on push.
  CHANNEL_ID: pr-${{ github.event.pull_request.number }}

jobs:
  web:
    name: Analyze, test, build & deploy
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage report
        # Report-only: no threshold, never fails the build.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

      - name: Build web
        run: flutter build web --release

      # Fork PRs do not receive repository secrets, so they only get the checks above.
      - name: Authenticate to Firebase
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy preview channel
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: preview
        run: |
          npx --yes firebase-tools@"$FIREBASE_TOOLS_VERSION" \
            hosting:channel:deploy "$CHANNEL_ID" --expires "$PREVIEW_EXPIRES" --json \
            > "$RUNNER_TEMP/firebase-preview.json"
          url=$(jq -r '[.result[]?.url] | map(select(. != null and . != "")) | .[0] // ""' \
            "$RUNNER_TEMP/firebase-preview.json")
          if [ -z "$url" ]; then
            echo "::error::No preview URL in the firebase-tools output."
            cat "$RUNNER_TEMP/firebase-preview.json"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify the AASA on the preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          url="${PREVIEW_URL%/}/.well-known/apple-app-site-association"
          headers="$RUNNER_TEMP/aasa.headers"
          body="$RUNNER_TEMP/aasa.json"
          body_norm="$RUNNER_TEMP/aasa.body.json"
          expected="$RUNNER_TEMP/aasa.expected.json"
          expected_src="web/.well-known/apple-app-site-association"
          attempts=6

          # Normalise the committed file once, and fail fast if it is not JSON: a
          # corrupt file must not normalise to the same empty output as an unparseable
          # response and compare equal.
          if ! jq -Se . "$expected_src" > "$expected"; then
            echo "::error::$expected_src is not valid JSON"
            exit 1
          fi

          # A freshly deployed channel can 404 (or still serve the previous file) while
          # the CDN catches up, so each attempt re-evaluates all three assertions for
          # about 25 s of sleeps before the failure is reported. A failed transfer
          # (curl non-zero) counts against the same budget: under `bash -e` a bare
          # assignment would abort the step before the retry. Each request is bounded
          # (3 s connect, 10 s total), so even six hung attempts finish in under 90 s.
          matched=""
          curl_rc=0
          http_status=""
          reason=""
          for attempt in $(seq "$attempts"); do
            # Truncate first, so a failed transfer cannot leave a previous attempt's
            # response behind to be reported or compared.
            : > "$headers"
            : > "$body"
            if out=$(curl -sS --connect-timeout 3 --max-time 10 \
              -H 'Cache-Control: no-cache' \
              -D "$headers" -o "$body" -w '%{http_code}' "$url"); then
              curl_rc=0
              http_status="$out"
            else
              curl_rc=$?
              http_status=""
            fi

            if [ "$curl_rc" -ne 0 ]; then
              reason="request failed (curl exit $curl_rc)"
            elif [ "$http_status" != "200" ]; then
              reason="HTTP $http_status"
            elif ! grep -qi '^content-type: *application/json' "$headers"; then
              reason="content-type is not application/json"
            elif ! jq -Se . "$body" > "$body_norm" 2>/dev/null \
              || ! diff -q "$expected" "$body_norm" >/dev/null; then
              reason="body does not match the committed file"
            else
              matched=1
              break
            fi

            if [ "$attempt" -lt "$attempts" ]; then
              echo "AASA not served correctly yet ($reason); retrying in 5 s..."
              sleep 5
            fi
          done

          if [ -z "$matched" ]; then
            if [ "$curl_rc" -ne 0 ]; then
              echo "::error::AASA request failed on all $attempts attempts (curl exit $curl_rc)"
              exit 1
            fi
            if [ "$http_status" != "200" ]; then
              echo "::error::AASA returned HTTP $http_status after $attempts attempts"
              exit 1
            fi
            if ! grep -qi '^content-type: *application/json' "$headers"; then
              echo "::error::AASA is not served as application/json"
              grep -i '^content-type:' "$headers" || true
              exit 1
            fi
            echo "::error::AASA does not match the committed file"
            if jq -Se . "$body" > "$body_norm" 2>/dev/null; then
              diff -u "$expected" "$body_norm" || true
            fi
            exit 1
          fi
      - name: Comment the preview URL on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          CHANNEL: ${{ env.CHANNEL_ID }}
          EXPIRES: ${{ env.PREVIEW_EXPIRES }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- ci-web-preview -->';
            const body = [
              marker,
              `🔥 **Firebase preview** for \`${process.env.CHANNEL}\` (auto-expires in ${process.env.EXPIRES}).`,
              '',
              `- Preview: ${process.env.PREVIEW_URL}`,
              `- Build log: ${process.env.RUN_URL}`,
            ].join('\n');

            try {
              const { owner, repo } = context.repo;
              const issue_number = context.issue.number;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const existing = comments.find((c) => c.body && c.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (err) {
              // The comment is informational; never fail the build over it.
              core.warning(`Could not post the preview comment: ${err.message}`);
            }

      - name: Deploy live
        if: github.event_name == 'push'
        run: npx --yes firebase-tools@"$FIREBASE_TOOLS_VERSION" deploy --only hosting

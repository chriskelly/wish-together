name: Web CI

# PR  -> analyze, test, build, deploy a Firebase Hosting preview channel and comment it on the PR.
# push to master -> the same checks, then deploy live to https://wishtogether.gift.
# Preview-channel cleanup lives in .github/workflows/ci-web-cleanup.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

# Collapse superseded PR runs; never cancel a live deploy on master.
concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned to the toolchain this repo targets (see AGENTS.md / pubspec.yaml).
  FLUTTER_VERSION: "3.47.7"
  FIREBASE_TOOLS_VERSION: "15.34.0"
  # Pinned because the script steps below (Sentry identity, source-map strip) run
  # on it.
  NODE_VERSION: "22"
  # Preview channels expire after this long; the PR comment quotes the same value.
  PREVIEW_EXPIRES: "7d"
  # Evaluates to `pr-<number>` on pull requests; unused on push.
  CHANNEL_ID: pr-${{ github.event.pull_request.number }}

jobs:
  web:
    name: Analyze, test, build & deploy
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage report
        # Report-only: no threshold, never fails the build.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

      # The DSN is public by design (it ships inside the bundle), so it lives in a
      # repository variable, not a secret. A fork PR receives neither that variable
      # nor the Sentry token, so it builds without diagnostics — and deploys
      # nothing. Every build this repository does deploy must report, so a missing
      # variable fails the run instead of shipping a silent bundle.
      - name: Resolve the Sentry configuration
        id: sentry
        env:
          # The same name the helper reads, so the two cannot drift apart.
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "Sentry: fork pull request, so no DSN, no environment override, no upload."
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A DSN never contains whitespace; a trailing newline from the variable
          # would end up inside the compiled define instead.
          SENTRY_DSN=$(printf '%s' "$SENTRY_DSN" | tr -d '[:space:]')
          if [ -z "$SENTRY_DSN" ]; then
            echo "::error::SENTRY_DSN is not set. A deployed build must report to Sentry; set the repository variable."
            exit 1
          fi

          # Fails here, with the reason, if the DSN cannot supply the ids the
          # upload needs. Exports SENTRY_ORG and SENTRY_PROJECT for later steps.
          node scripts/sentry-identity.mjs >> "$GITHUB_ENV"

          # A preview is not production: every alert filters on
          # environment:production, so preview traffic must never match.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            environment=preview
          else
            environment=production
          fi

          {
            echo "dsn=$SENTRY_DSN"
            echo "environment=$environment"
            echo "upload=true"
          } >> "$GITHUB_OUTPUT"
          echo "Sentry: DSN present, environment=$environment, source maps will be uploaded."

      - name: Build web
        env:
          DSN: ${{ steps.sentry.outputs.dsn }}
          ENVIRONMENT: ${{ steps.sentry.outputs.environment }}
        run: |
          if [ -z "$DSN" ]; then
            flutter build web --release
          else
            flutter build web --release --source-maps \
              --dart-define=WT_SENTRY_DSN="$DSN" \
              --dart-define=WT_SENTRY_ENVIRONMENT="$ENVIRONMENT" \
              --dart-define=WT_BUILD_ID="$GITHUB_SHA"
          fi

      # The dart-defines and `--source-maps` are the whole link between this
      # bundle, the upload below and the release the app reports, so assert they
      # reached the output. The uploader treats a build with no `.map` files as
      # nothing to do and exits successfully, so without this a lost
      # `--source-maps` would ship unsymbolicated stack traces in silence.
      - name: Verify the bundle carries its Sentry identity
        if: steps.sentry.outputs.upload == 'true'
        env:
          DSN: ${{ steps.sentry.outputs.dsn }}
        run: |
          bundle=build/web/main.dart.js
          map=build/web/main.dart.js.map
          if [ ! -f "$bundle" ]; then
            echo "::error::$bundle is missing"
            exit 1
          fi
          if [ ! -f "$map" ]; then
            echo "::error::$map is missing; --source-maps did not take, so there is nothing to upload."
            exit 1
          fi
          for marker in "$DSN" "$GITHUB_SHA"; do
            if ! grep -qF -- "$marker" "$bundle"; then
              echo "::error::$bundle does not embed $marker; the matching --dart-define did not reach the build."
              exit 1
            fi
          done
          echo "Bundle embeds the DSN and build $GITHUB_SHA, with a source map to upload."

      # A failed upload fails the run: a deployed bundle without its source maps
      # reports minified stack traces, which is worse than not deploying.
      - name: Upload symbols to Sentry
        if: steps.sentry.outputs.upload == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # The identity the app reports at runtime must match the upload.
          SENTRY_RELEASE: wishtogether@${{ github.sha }}
          SENTRY_DIST: web-${{ github.sha }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::SENTRY_AUTH_TOKEN is not set; a deployed build must upload its source maps."
            exit 1
          fi
          dart run sentry_dart_plugin --sentry-define=upload_debug_symbols=false

      # Fork PRs do not receive repository secrets, so they only get the checks above.
      - name: Authenticate to Firebase
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy preview channel
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: preview
        run: |
          npx --yes firebase-tools@"$FIREBASE_TOOLS_VERSION" \
            hosting:channel:deploy "$CHANNEL_ID" --expires "$PREVIEW_EXPIRES" --json \
            > "$RUNNER_TEMP/firebase-preview.json"
          url=$(jq -r '[.result[]?.url] | map(select(. != null and . != "")) | .[0] // ""' \
            "$RUNNER_TEMP/firebase-preview.json")
          if [ -z "$url" ]; then
            echo "::error::No preview URL in the firebase-tools output."
            cat "$RUNNER_TEMP/firebase-preview.json"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify the AASA on the preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          url="${PREVIEW_URL%/}/.well-known/apple-app-site-association"
          headers="$RUNNER_TEMP/aasa.headers"
          body="$RUNNER_TEMP/aasa.json"
          body_norm="$RUNNER_TEMP/aasa.body.norm.json"
          expected="$RUNNER_TEMP/aasa.expected.json"
          expected_src="web/.well-known/apple-app-site-association"
          attempts=6
          retry_delay=5
          connect_timeout=3
          request_timeout=10

          # The committed file must be valid JSON before anything is compared: a corrupt
          # file must not normalise to the same empty output as an unparseable response.
          command -v jq >/dev/null || { echo "::error::jq is required for this check"; exit 1; }

          if [ ! -f "$expected_src" ]; then
            echo "::error::$expected_src is missing"
            exit 1
          fi
          if ! jq -S . "$expected_src" > "$expected" || [ ! -s "$expected" ]; then
            echo "::error::$expected_src is not valid JSON"
            exit 1
          fi

          # A freshly deployed channel can 404, or still serve the previous file, while
          # the CDN catches up, so every assertion is re-evaluated on each attempt. A
          # failed transfer (non-zero curl) counts against the same budget: under
          # `bash -e` a bare assignment would abort before the retry. Every request is
          # bounded (3 s connect, 10 s total), so even hung attempts cannot outlast the
          # step: at most 85 s, sleeps included.
          matched=""
          cause=""
          reason=""
          curl_rc=0
          http_status=""
          for ((attempt = 1; attempt <= attempts; attempt++)); do
            # Truncate first, so a failed transfer cannot leave an earlier response to
            # be reported or compared.
            : > "$headers"
            : > "$body"
            if out=$(curl -sS --connect-timeout "$connect_timeout" --max-time "$request_timeout" \
              -D "$headers" -o "$body" -w '%{http_code}' "$url"); then
              curl_rc=0
              http_status="$out"
            else
              curl_rc=$?
              http_status=""
            fi

            if [ "$curl_rc" -ne 0 ]; then
              cause="curl"
              reason="request failed with curl exit $curl_rc"
            elif [ "$http_status" != "200" ]; then
              cause="http"
              reason="HTTP $http_status"
            elif [ "$(grep -ic '^content-type:' "$headers")" -ne 1 ]; then
              cause="ctype"
              reason="content-type header is missing or duplicated"
            elif ! grep -qiE '^content-type:[[:space:]]*application/json[[:space:]]*(;.*)?$' "$headers"; then
              cause="ctype"
              ctype=$(grep -i '^content-type:' "$headers" | sed 's/^[^:]*: *//' | tr -d '\000-\010\013-\037' | head -c 200 || true)
              reason="content-type is ${ctype:-missing}"
            elif [ ! -s "$body" ] || ! jq -S . "$body" > "$body_norm" 2>/dev/null || [ ! -s "$body_norm" ]; then
              cause="json"
              reason="body is not valid JSON"
            elif ! diff -q "$expected" "$body_norm" >/dev/null; then
              cause="body"
              reason="body does not match the committed file"
            else
              matched=1
              break
            fi

            if [ "$attempt" -lt "$attempts" ]; then
              echo "AASA not served correctly yet ($reason); retrying in ${retry_delay} s..."
              sleep "$retry_delay"
            fi
          done

          if [ -z "$matched" ]; then
            echo "::error::AASA was not served correctly after $attempts attempts (last failure: $reason)"
            case "$cause" in
              curl) ;;
              http) ;;
              ctype) grep -i '^content-type:' "$headers" | tr -d '\000-\010\013-\037' | head -c 200 || true ;;
              # Drop control bytes but keep TAB and LF, so the excerpt stays readable;
              # CR and ESC must never reach the log or an annotation.
              json) head -c 500 "$body" 2>/dev/null | tr -d '\000-\010\013-\037' | sed 's/^/  /' || true; echo ;;
              body) diff -u "$expected" "$body_norm" 2>/dev/null | sed 's/^/  /' | head -c 4000 || true ;;
              *) echo "unclassified failure" ;;
            esac
            exit 1
          fi

      - name: Comment the preview URL on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          CHANNEL: ${{ env.CHANNEL_ID }}
          EXPIRES: ${{ env.PREVIEW_EXPIRES }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- ci-web-preview -->';
            const body = [
              marker,
              `🔥 **Firebase preview** for \`${process.env.CHANNEL}\` (auto-expires in ${process.env.EXPIRES}).`,
              '',
              `- Preview: ${process.env.PREVIEW_URL}`,
              `- Build log: ${process.env.RUN_URL}`,
            ].join('\n');

            try {
              const { owner, repo } = context.repo;
              const issue_number = context.issue.number;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const existing = comments.find((c) => c.body && c.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (err) {
              // The comment is informational; never fail the build over it.
              core.warning(`Could not post the preview comment: ${err.message}`);
            }

      - name: Deploy live
        if: github.event_name == 'push'
        run: npx --yes firebase-tools@"$FIREBASE_TOOLS_VERSION" deploy --only hosting

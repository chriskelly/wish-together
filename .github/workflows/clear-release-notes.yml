name: Clear release notes

# What's New lives in fastlane/metadata/en-US/release_notes.txt so a release runs
# without opening App Store Connect. Once a release has been submitted, those
# notes describe a version that already exists, so they are cleared here: the
# next release has to write its own, and app_store_release refuses to submit an
# empty file.
#
# This is the only workflow that commits to master. It touches one metadata file
# and pushes with [skip ci], so it cannot deploy anything or consume a signing
# secret.

on:
  workflow_run:
    workflows: ["App Store Release"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: clear-release-notes
  cancel-in-progress: false

jobs:
  clear:
    name: Clear the submitted release notes
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Empty the notes file
        run: |
          file=fastlane/metadata/en-US/release_notes.txt
          if [ ! -f "$file" ]; then
            echo "::error::$file does not exist"
            exit 1
          fi
          if [ ! -s "$file" ]; then
            echo "Release notes are already empty; nothing to clear."
            exit 0
          fi

          # Truncate rather than delete: an empty file is what
          # validate_release_notes! refuses, and keeping the path makes the next
          # release's diff obvious.
          : > "$file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "chore(release): clear the release notes after submitting the App Store release [skip ci]"
          git push origin HEAD:master

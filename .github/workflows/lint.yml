name: Lint

# Fast, narrow gate for the CI plumbing itself: lints every workflow file and
# every tracked `.sh` script, runs the preview-auth and dev-script tests, and
# loads the Fastlane/Bundler setup (which validates Gemfile/Gemfile.lock bumps,
# e.g. Dependabot PRs). Scoped by `paths` so it is skipped for app-only changes.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - '*.sh'
      - '**/*.sh'
      - 'fastlane/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'scripts/**'
      - 'tool/**'
      - 'lib/dev/fixtures/**'
      - 'firebase.staging.json'
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - '*.sh'
      - '**/*.sh'
      - 'fastlane/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'scripts/**'
      - 'tool/**'
      - 'lib/dev/fixtures/**'
      - 'firebase.staging.json'

permissions:
  contents: read

# Collapse superseded PR runs; never cancel a run on master.
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned; bump together with the download script's tag below.
  ACTIONLINT_VERSION: "1.7.12"
  # Pinned so a runner-image change cannot silently change the shell lint.
  SHELLCHECK_VERSION: "0.11.0"

jobs:
  lint:
    name: Workflows, Fastlane, scripts & dev runner
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install actionlint
        # The downloader is itself pinned (tag in the URL, version hardcoded in
        # ACTIONLINT_VERSION) so this step is reproducible.
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") \
            "$ACTIONLINT_VERSION" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install shellcheck
        # Pinned release tarball, so the version here, not the runner image,
        # decides what passes.
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint .github/workflows/*.yml

      - name: Lint shell scripts
        # Every tracked `*.sh` script, so a new shell file is covered without
        # editing this list; includes the preview-auth helper and its tests.
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

      - name: Test the preview-auth skill script
        # preview-auth changes the browser API key's HTTP referrers and the
        # Auth authorized domains, so its logic is covered here rather than
        # only by hand. No network: the test stubs curl and gcloud.
        run: bash .agents/skills/preview-auth/scripts/preview-auth.test.sh

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Test the dev scripts
        # The rules-release verifier gates the staging deploy, so its tests
        # must run before that verifier is trusted in CI.
        run: npm ci && npm test
        working-directory: scripts

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Load the Fastlane setup
        # Resolves the Gemfile/Gemfile.lock — a broken or conflicting dependency
        # bump fails here rather than during a release.
        run: bundle exec fastlane lanes

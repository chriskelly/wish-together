name: iOS TestFlight

# Runs after "iOS CI" finishes on a pull request and uploads an internal
# TestFlight build. Opt out per-PR with the `no-deploy` label.
#
# Chained via workflow_run (not pull_request) so this never appears as a
# permanently-Skipped check on ordinary PRs.

on:
  workflow_run:
    workflows: ["iOS CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to comment on (required for manual runs)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-release-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Build & upload to TestFlight
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-26
    permissions:
      contents: read
      pull-requests: write
    env:
      CI: true
      FLUTTER_VERSION: "3.47.7"
      APP_IDENTIFIER: gift.wishtogether
      DEVELOPMENT_TEAM: CD8XP2U645
      # Fallback only — App Store Connect build numbers are monotonic per app.
      BUILD_NUMBER: ${{ github.run_number }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
    steps:
      - name: Resolve PR context
        id: pr
        uses: actions/github-script@v9
        env:
          # Passed via env, never interpolated into the script (dispatch inputs
          # are attacker-influenced text).
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            let prNumber;

            if (context.eventName === 'workflow_dispatch') {
              prNumber = Number(process.env.PR_NUMBER_INPUT);
            } else {
              const prs = context.payload.workflow_run.pull_requests || [];
              if (prs.length) {
                prNumber = prs[0].number;
              } else {
                // The workflow_run payload omits pull_requests for some runs;
                // fall back to matching the head branch.
                const head = context.payload.workflow_run.head_branch;
                const { data } = await github.rest.pulls.list({
                  owner,
                  repo,
                  state: 'open',
                  head: `${owner}:${head}`,
                  per_page: 1,
                });
                if (!data.length) {
                  core.setFailed(`No open pull request found for branch ${head}.`);
                  return;
                }
                prNumber = data[0].number;
              }
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            const labels = pr.labels.map((l) => l.name);

            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('no_deploy', String(labels.includes('no-deploy')));

      - name: Checkout
        if: steps.pr.outputs.no_deploy != 'true'
        uses: actions/checkout@v7
        with:
          # Build exactly the commit iOS CI validated — the branch head may have
          # moved on since. Manual runs have no workflow_run, so fall back to the ref.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || steps.pr.outputs.head_ref }}

      - name: Set up Flutter
        if: steps.pr.outputs.no_deploy != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.pr.outputs.no_deploy != 'true'
        run: flutter pub get

      - name: Set up Ruby
        if: steps.pr.outputs.no_deploy != 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure SSH for match
        if: steps.pr.outputs.no_deploy != 'true'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Add GitHub to known hosts
        if: steps.pr.outputs.no_deploy != 'true'
        run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Build and upload to TestFlight
        if: steps.pr.outputs.no_deploy != 'true'
        run: bundle exec fastlane testflight_release

      - name: Comment on the PR
        if: always() && steps.pr.outputs.pr_number != ''
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          SKIPPED: ${{ steps.pr.outputs.no_deploy == 'true' }}
          JOB_STATUS: ${{ job.status }}
          # The lane resolves a build number from App Store Connect and republishes it here.
          BUILD_NUMBER: ${{ env.RESOLVED_BUILD_NUMBER || env.BUILD_NUMBER }}
        with:
          script: |
            const marker = '<!-- testflight-release -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const skipped = process.env.SKIPPED === 'true';
            const uploaded = process.env.JOB_STATUS === 'success';

            let body;
            if (skipped) {
              body = [
                marker,
                '### TestFlight — skipped',
                '',
                'This PR has the `no-deploy` label, so no TestFlight build was uploaded.',
                `iOS CI already ran \`flutter test\` + \`flutter build ios --simulator\`.`,
                '',
                `[View workflow run](${runUrl})`,
              ].join('\n');
            } else if (uploaded) {
              body = [
                marker,
                '### TestFlight — build uploaded',
                '',
                `Build number: **${process.env.BUILD_NUMBER}**`,
                '',
                'Install from TestFlight once Apple finishes processing (usually 10–20 minutes).',
                '',
                `[View workflow run](${runUrl})`,
              ].join('\n');
            } else {
              body = [
                marker,
                '### TestFlight — not uploaded',
                '',
                'The TestFlight upload did not complete (failed or cancelled). Check the workflow log.',
                '',
                `[View workflow run](${runUrl})`,
              ].join('\n');
            }

            try {
              const { owner, repo } = context.repo;
              const issue_number = Number(process.env.PR_NUMBER);
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const existing = comments.find((c) => c.body && c.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (err) {
              // The comment is informational; never fail the job over it.
              core.warning(`Could not post the TestFlight comment: ${err.message}`);
            }
